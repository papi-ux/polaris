<svg xmlns="http://www.w3.org/2000/svg" width="800" height="3" viewBox="0 0 800 3" preserveAspectRatio="none" role="presentation">
  <style>
    @keyframes aur-sh{from{transform:translateX(-800px)}to{transform:translateX(800px)}}
    @media (prefers-reduced-motion: no-preference){.sh{animation:aur-sh 7s linear infinite}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c73ff"/>
      <stop offset="1" stop-color="#c8d6e5"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="3" fill="url(#g)" opacity=".85"/>
  <rect class="sh" width="260" height="3" fill="url(#s)"/>
</svg>
