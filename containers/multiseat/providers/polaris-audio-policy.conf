# Loaded only by the explicitly selected private `polaris` profile.
# The packaged 0.5.8 components supply adapter configuration and link lifetime.
wireplumber.profiles = {
  polaris = {
    inherits = [ base, mixin.systemwide-session, mixin.stateless ]
    metadata.sm-settings = required
    support.standard-event-source = required
    policy.client.access = required
    policy.node = required
    policy.linking.standard = required
    metadata.default = required
    hooks.linking.target.polaris = required

    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    support.dbus = disabled
    metadata.sm-objects = disabled
    hooks.filter.forward-format = disabled
    hooks.linking.target.find-media-role = disabled
    hooks.linking.target.find-defined = disabled
    hooks.linking.target.find-filter = disabled
    hooks.linking.target.find-default = disabled
    hooks.linking.target.find-best = disabled
    hooks.linking.target.get-filter-from = disabled
  }
}

wireplumber.components = [
  {
    name = /usr/share/polaris/wireplumber/allocated-target.lua
    type = script/lua
    provides = hooks.linking.target.polaris
  }
]

wireplumber.settings = {
  linking.allow-moving-streams = false
  linking.follow-default-target = false
  node.features.audio.monitor-ports = true
  node.features.audio.control-port = false
}
