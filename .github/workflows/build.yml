name: Build Polaris

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* release tag to rebuild and upload release assets for'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POLARIS_CHECKOUT_REF: ${{ inputs.release_tag || github.ref }}
  POLARIS_PACKAGE_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
  # Advance deliberately only after the full matrix proves a newer snapshot.
  UBUNTU_APT_SNAPSHOT: 20260901T000000Z

jobs:
  resolve-source:
    name: Resolve exact source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      native_required: ${{ steps.source.outputs.native_required }}
      version: ${{ steps.source.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.POLARIS_CHECKOUT_REF }}

      - name: Verify build scope classifier
        run: tests/scripts/test_classify_native_build.sh

      - name: Bind release tag to source commit
        id: source
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          set -euo pipefail

          source_commit="$(git rev-parse HEAD)"
          build_version="$(grep -Pom1 '^project\(Polaris VERSION \K[^ ]+' CMakeLists.txt)"
          native_required=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
            native_required="$(git diff --name-only --no-renames -z "$BASE_COMMIT" "$source_commit" | scripts/ci/classify-native-build.sh)"
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            release_tag="${POLARIS_PACKAGE_REF_NAME}"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH: $release_tag" >&2
              exit 1
            fi
            if [ "$release_tag" != "v${build_version}" ]; then
              echo "Release tag $release_tag does not match source version v${build_version}" >&2
              exit 1
            fi

            git tag -d "$release_tag" >/dev/null 2>&1 || true
            git fetch --no-tags --force origin \
              "refs/tags/${release_tag}:refs/tags/${release_tag}"
            tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            if [ "$tag_commit" != "$source_commit" ]; then
              echo "Release tag $release_tag resolves to $tag_commit, not checked-out source $source_commit" >&2
              exit 1
            fi
          fi

          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "native_required=$native_required" >> "$GITHUB_OUTPUT"
          echo "version=$build_version" >> "$GITHUB_OUTPUT"

  web-checks:
    name: Web checks
    needs: resolve-source
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --fund=false

      - name: Audit web dependencies
        run: npm audit --audit-level=high

      - name: Lint web UI
        run: npm run lint

      - name: Test web UI
        run: npm run test

      - name: Build web UI bundle
        run: npm run build-clean

      - name: Pack web UI bundle
        run: tar -czf web-ui-build.tar.gz -C build/assets web

      - name: Upload web UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-build
          path: web-ui-build.tar.gz
          if-no-files-found: error

  cpp-sanitizer-tests:
    name: C++ sanitizer tests
    needs: resolve-source
    if: needs.resolve-source.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Ubuntu package downloads
        uses: actions/cache@v6
        with:
          path: /var/tmp/polaris-ubuntu-archives
          key: polaris-ubuntu-apt-${{ env.UBUNTU_APT_SNAPSHOT }}-sanitizer-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            polaris-ubuntu-apt-${{ env.UBUNTU_APT_SNAPSHOT }}-sanitizer-

      - name: Install dependencies
        # This suite installs the larger dependency set; the pinned snapshot
        # completed in 18m03s on the first protected run, but the snapshot
        # service can exceed 30 minutes. Keep the stall bounded without turning
        # transient mirror pressure into a false source failure.
        timeout-minutes: 60
        run: |
          snapshot_sources="$RUNNER_TEMP/polaris-ubuntu-snapshot.sources"
          snapshot_source_parts="$RUNNER_TEMP/polaris-ubuntu-source-parts"
          snapshot_lists="$RUNNER_TEMP/polaris-ubuntu-lists"
          snapshot_archives="/var/tmp/polaris-ubuntu-archives"
          mkdir -p "$snapshot_source_parts" "$snapshot_lists/partial" "$snapshot_archives/partial"
          sudo chown -R _apt:root "$snapshot_archives/partial"
          cat > "$snapshot_sources" <<EOF
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/$UBUNTU_APT_SNAPSHOT/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$snapshot_sources"
            -o "Dir::Etc::sourceparts=$snapshot_source_parts"
            -o "Dir::State::Lists=$snapshot_lists"
            -o "Dir::Cache::archives=$snapshot_archives"
            -o APT::Update::Error-Mode=any
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          curl_snapshot_version="$(apt-cache "${apt_options[@]}" madison libcurl4-openssl-dev | awk 'NR == 1 {print $3}')"
          if [[ -z "$curl_snapshot_version" ]]; then
            echo "::error::Pinned Ubuntu snapshot does not contain libcurl4-openssl-dev"
            exit 1
          fi
          sudo apt-get "${apt_options[@]}" install -y --allow-downgrades \
            build-essential cmake ninja-build \
            libboost-all-dev libssl-dev libevdev-dev \
            libpulse-dev libopus-dev \
            "libcurl4t64=$curl_snapshot_version" "libcurl4-openssl-dev=$curl_snapshot_version" \
            libdrm-dev libgbm-dev libcap-dev libwayland-dev \
            libpipewire-0.3-dev libx11-dev libxrandr-dev \
            libxfixes-dev libxi-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libva-dev libminiupnpc-dev libnotify-dev nlohmann-json3-dev \
            libappindicator3-dev libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            glslang-tools libvulkan-dev \
            wayland-protocols
          sudo chmod -R a+rX "$snapshot_archives"

      - name: Configure sanitizer build
        run: |
          cmake -B build-sanitize -G Ninja \
            -DBUILD_TESTS=ON \
            -DBUILD_FULL_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DPOLARIS_ENABLE_CUDA=OFF \
            -DPOLARIS_ENABLE_BROWSER_STREAM=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF

      - name: Build sanitizer unit tests
        run: |
          cmake --build build-sanitize --target \
            test_polaris test_polaris_audio test_polaris_audit test_polaris_config \
            test_polaris_http test_polaris_input test_polaris_network test_polaris_pairing \
            test_polaris_platform test_polaris_steam_shutdown test_polaris_stream test_polaris_video \
            -j"$(nproc)"

      - name: Run sanitizer and gamescope ownership tests
        # Coverage here grew one target at a time, each fix adding only what it
        # needed, so suites that existed were never run. Keep every BUILD_FULL_TESTS
        # executable in both this build list and the anchored ctest expression;
        # narrow deliberately only if a suite earns it.
        run: |
          ctest --test-dir build-sanitize/tests --output-on-failure -R '^(test_polaris|test_polaris_audio|test_polaris_audit|test_polaris_config|test_polaris_http|test_polaris_input|test_polaris_network|test_polaris_pairing|test_polaris_platform|test_polaris_steam_shutdown|test_polaris_stream|test_polaris_video|polaris_gamescope_runtime_shell|polaris_gamescope_session_stop_shell|polaris_gamescope_session_geometry_shell|polaris_gamescope_primary_child_shell)$'

  arch-build:
    name: Arch build
    needs: [resolve-source, web-checks]
    if: needs.resolve-source.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    container:
      # Keep the base immutable. The repository snapshot and hash-pinned Boost
      # overlay below define the complete package userspace used by the build.
      image: archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a
    env:
      ARCH_REPOSITORY_SNAPSHOT: 2026/08/19
      ARCH_BOOST_PACKAGE_VERSION: 1.92.0-1
      ARCH_BOOST_SHA256: 0d795c6401c8bfa16012ada7e2e7f34934fb268f9174470edac1b389056f79bb
      ARCH_BOOST_LIBS_SHA256: 4b1392e578e46c1b23910d1c26956927d7e986d6afd5090be59045afb3c04f8d
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Pin Arch package snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_REPOSITORY_SNAPSHOT" > /etc/pacman.d/mirrorlist
          pacman -Syy --noconfirm

      - name: Bootstrap Arch container
        run: pacman -Syu --noconfirm --needed archlinux-keyring git

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Initialize submodules
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            git submodule sync --recursive
            # Trees from before the build-deps submodule removal still pin its
            # dead commit; skip it instead of gambling on the orphaned object.
            if git -c protocol.version=2 -c submodule.third-party/build-deps.update=none submodule update --init --force --recursive --jobs 1; then
              exit 0
            fi
            echo "submodule update failed on attempt ${attempt}" >&2
            git submodule deinit --force --all || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Cache C++ compiler outputs
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ccache
          key: polaris-arch-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'src/**/*', 'tests/**/*') }}
          restore-keys: |
            polaris-arch-ccache-

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: /github/home/.npm
          key: polaris-arch-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            polaris-arch-npm-
      - name: Cache Go module downloads
        uses: actions/cache@v6
        with:
          path: /github/home/go/pkg/mod
          key: polaris-arch-gomod-${{ hashFiles('browser_stream_helper/go.sum') }}
          restore-keys: |
            polaris-arch-gomod-

      - name: Install dependencies
        # The archive snapshot is immutable, so the database fetched before
        # bootstrap and the package pool used here describe the same instant.
        # Do not add mirror retries: they cannot repair a live mirror serving a
        # database and package pool from different sync generations.
        # The list stays a backslash continuation rather than moving into a
        # variable: check-release-package-dependencies.py reads these tokens
        # out of this step to enforce the Vulkan contract, and a quoted string
        # hides them from its shlex pass.
        run: |
          pacman -Syu --noconfirm --needed \
            appstream appstream-glib avahi base-devel boost boost-libs ccache cmake curl \
            desktop-file-utils ffmpeg gtk3 libayatana-appindicator libcap \
            gcc go libdrm libevdev libmfx libnotify libpulse libva libx11 libxcb \
            libxfixes libxi libxrandr libxtst mesa miniupnpc ninja nodejs \
            nlohmann-json npm numactl openssl opus pipewire python shaderc vulkan-headers vulkan-icd-loader \
            wayland wayland-protocols which

      - name: Install pinned Boost ABI
        run: |
          set -euo pipefail

          boost_package="$RUNNER_TEMP/boost-${ARCH_BOOST_PACKAGE_VERSION}-x86_64.pkg.tar.zst"
          boost_libraries_package="$RUNNER_TEMP/boost-libs-${ARCH_BOOST_PACKAGE_VERSION}-x86_64.pkg.tar.zst"
          archive_base="https://archive.archlinux.org/packages/b"

          curl --fail --location --show-error \
            --output "$boost_package" \
            "${archive_base}/boost/boost-${ARCH_BOOST_PACKAGE_VERSION}-x86_64.pkg.tar.zst"
          curl --fail --location --show-error \
            --output "$boost_libraries_package" \
            "${archive_base}/boost-libs/boost-libs-${ARCH_BOOST_PACKAGE_VERSION}-x86_64.pkg.tar.zst"

          printf '%s  %s\n' "$ARCH_BOOST_SHA256" "$boost_package" | sha256sum --check --strict
          printf '%s  %s\n' "$ARCH_BOOST_LIBS_SHA256" "$boost_libraries_package" | sha256sum --check --strict
          pacman -U --noconfirm "$boost_package" "$boost_libraries_package"

      - name: Configure
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPOLARIS_ENABLE_CUDA=OFF \
            -DPOLARIS_ENABLE_BROWSER_STREAM=ON \
            -DCUDA_FAIL_ON_MISSING=OFF

      - name: Download prebuilt web UI bundle
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        uses: actions/download-artifact@v8
        with:
          name: web-ui-build
          path: .

      - name: Prepare prebuilt web UI bundle
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        run: |
          mkdir -p build/assets build/CMakeFiles node_modules
          tar -xzf web-ui-build.tar.gz -C build/assets
          touch node_modules/.polaris-web-ui-npm.stamp build/CMakeFiles/web-ui-build.stamp

      - name: Build
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        run: cmake --build build -j"$(nproc)"

      - name: Run fast C++ tests
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        run: ctest --test-dir build/tests --output-on-failure -R '^test_polaris$'

      - name: Generate Arch package files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BUILD_VERSION="$(grep -Pom1 '^project\(Polaris VERSION \K[^ ]+' CMakeLists.txt)"
          BRANCH="${GITHUB_HEAD_REF:-$POLARIS_PACKAGE_REF_NAME}"
          COMMIT="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          env \
            BRANCH="$BRANCH" \
            BUILD_VERSION="$BUILD_VERSION" \
            CLONE_URL="file://$GITHUB_WORKSPACE" \
            COMMIT="$COMMIT" \
            cmake -S . -B arch-pkgbuild \
              -DPOLARIS_CONFIGURE_PKGBUILD=ON \
              -DPOLARIS_CONFIGURE_ONLY=ON
          python3 - <<'PY'
          from pathlib import Path

          pkgbuild = Path("arch-pkgbuild/PKGBUILD")
          text = pkgbuild.read_text()
          if "  'go'\n" not in text:
              text = text.replace("  'git'\n", "  'git'\n  'go'\n")
          if "-D POLARIS_ENABLE_BROWSER_STREAM=ON" not in text:
              text = text.replace(
                  '      -D POLARIS_ASSETS_DIR="share/polaris"\n',
                  '      -D POLARIS_ASSETS_DIR="share/polaris"\n'
                  '      -D POLARIS_ENABLE_BROWSER_STREAM=ON\n',
              )
          pkgbuild.write_text(text)
          PY

      - name: Validate Arch package
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          useradd -m builder
          # The base system was synchronized before the exact Boost overlay.
          # Installing only CUDA here cannot downgrade that overlay back to
          # the older repository-snapshot Boost ABI.
          pacman -S --noconfirm --needed cuda

          # CUDA 13 supports GCC up to 15.x. Arch rolling moved to GCC 16,
          # so use Arch's cuda-provided gcc15 toolchain when present. Older
          # images may still need the archive downgrade fallback.
          arch_makepkg_env="_use_cuda=true"
          gcc_major="$(g++ -dumpfullversion | cut -d. -f1)"
          if [ "${gcc_major}" -gt 15 ]; then
            if command -v g++-15 >/dev/null 2>&1 && command -v gcc-15 >/dev/null 2>&1; then
              arch_makepkg_env="CC=$(command -v gcc-15) CXX=$(command -v g++-15) NVCC_CCBIN=$(command -v g++-15) ${arch_makepkg_env}"
            else
              gcc15_version="15.2.1+r604+g0b99615a8aef-1"
              archive_base="https://archive.archlinux.org/packages"
              pacman -U --noconfirm \
                "${archive_base}/g/gcc/gcc-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/g/gcc-libs/gcc-libs-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libasan/libasan-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libatomic/libatomic-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libgcc/libgcc-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libgfortran/libgfortran-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libgomp/libgomp-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/liblsan/liblsan-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libobjc/libobjc-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libquadmath/libquadmath-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libstdc++/libstdc++-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libtsan/libtsan-${gcc15_version}-x86_64.pkg.tar.zst" \
                "${archive_base}/l/libubsan/libubsan-${gcc15_version}-x86_64.pkg.tar.zst"
            fi
          fi

          install -d "$CCACHE_DIR"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          chown -R builder:builder "$CCACHE_DIR"
          su builder -c "git config --global protocol.file.allow always"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"
          su builder -c "cd '$GITHUB_WORKSPACE/arch-pkgbuild' && ${arch_makepkg_env} makepkg --nodeps --noconfirm --nocheck"

      - name: Smoke test Arch package
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          set -euo pipefail

          pkg_path="$(find arch-pkgbuild -maxdepth 1 -type f -name 'polaris-[0-9]*-x86_64.pkg.tar.*' ! -name '*debug*' | sort | head -n 1)"
          if [ -z "$pkg_path" ]; then
            echo "No Arch package was produced" >&2
            exit 1
          fi

          tar -xOf "$pkg_path" .BUILDINFO | tee arch-pkgbuild/package-buildinfo.txt
          tar -xOf "$pkg_path" .PKGINFO | tee arch-pkgbuild/package-pkginfo.txt

          if ! grep -Fq "installed = cuda-" arch-pkgbuild/package-buildinfo.txt; then
            echo "Arch package was not built with CUDA installed" >&2
            exit 1
          fi

          if ! grep -Fq "optdepend = cuda: Nvidia GPU encoding support" arch-pkgbuild/package-pkginfo.txt; then
            echo "Arch package metadata does not advertise CUDA/Nvidia GPU encoding support" >&2
            exit 1
          fi

          boost_version="$(pacman -Q boost-libs | awk '{ print $2 }' | sed 's/-.*$//')"
          if ! grep -Fq "installed = boost-libs-${boost_version}-" arch-pkgbuild/package-buildinfo.txt; then
            echo "Arch package was not built against installed boost-libs ${boost_version}" >&2
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          bsdtar -xf "$pkg_path" -C "$extract_dir" usr/bin
          binary="$(find "$extract_dir/usr/bin" -maxdepth 1 -type f -name 'polaris-[0-9]*' -perm -111 | sort | head -n 1)"
          if [ -z "$binary" ]; then
            echo "Packaged Polaris binary was not found" >&2
            exit 1
          fi
          if [ ! -x "$extract_dir/usr/bin/polaris-browser-stream-helper" ]; then
            echo "Packaged Browser Stream helper was not found" >&2
            exit 1
          fi
          for gamescope_payload in polaris-gamescope-session polaris-gamescope-runtime-lib.sh; do
            if [ ! -x "$extract_dir/usr/bin/$gamescope_payload" ]; then
              echo "Packaged Gamescope payload was not found: $gamescope_payload" >&2
              exit 1
            fi
            bash -n "$extract_dir/usr/bin/$gamescope_payload"
          done

          strings "$binary" > arch-pkgbuild/package-strings.txt
          if ! grep -Fq "Couldn't initialize cuda" arch-pkgbuild/package-strings.txt; then
            echo "Packaged Polaris binary does not contain CUDA support" >&2
            exit 1
          fi

          readelf -d "$binary" | tee arch-pkgbuild/package-needed.txt
          boost_sonames="$(awk -F '[][]' '/NEEDED.*libboost/ { print $2 }' arch-pkgbuild/package-needed.txt)"
          if [ -z "$boost_sonames" ]; then
            echo "No dynamic Boost sonames were found in the Arch package" >&2
            exit 1
          fi

          while IFS= read -r soname; do
            if [[ "$soname" != *".${boost_version}" ]]; then
              echo "Arch package Boost soname mismatch: ${soname} does not match boost-libs ${boost_version}" >&2
              exit 1
            fi

            dependency="${soname%%.so.*}.so"
            if ! grep -Fq "depend = ${dependency}=${boost_version}-" arch-pkgbuild/package-pkginfo.txt; then
              echo "Arch package does not declare the versioned provider for ${soname}" >&2
              exit 1
            fi
          done <<< "$boost_sonames"

          pacman -U --noconfirm "$pkg_path"
          pacman -Ql polaris | tee arch-pkgbuild/package-installed-files.txt >/dev/null
          installed_binary="$(awk '/\/usr\/bin\/polaris-[0-9][^/]*$/ { print $2; exit }' arch-pkgbuild/package-installed-files.txt)"
          if [ -z "$installed_binary" ]; then
            echo "Installed Polaris binary was not found" >&2
            exit 1
          fi
          if [ ! -x /usr/bin/polaris-browser-stream-helper ]; then
            echo "Installed Arch package is missing the Browser Stream helper" >&2
            exit 1
          fi
          for gamescope_payload in /usr/bin/polaris-gamescope-session /usr/bin/polaris-gamescope-runtime-lib.sh; do
            if [ ! -x "$gamescope_payload" ]; then
              echo "Installed Arch package is missing a Gamescope payload: $gamescope_payload" >&2
              exit 1
            fi
            bash -n "$gamescope_payload"
          done

          ldd "$installed_binary" | tee arch-pkgbuild/package-ldd.txt
          if grep -Fq "not found" arch-pkgbuild/package-ldd.txt; then
            echo "Installed Arch package has unresolved shared-library dependencies" >&2
            exit 1
          fi

          polaris --version | tee arch-pkgbuild/package-version.txt

      - name: Summarize Arch validation
        if: always()
        run: |
          {
            echo "## Arch validation"
            echo
            echo "- Generated package files: \`arch-pkgbuild/PKGBUILD\`, \`arch-pkgbuild/polaris.install\`"
            echo "- Built package directory: \`arch-pkgbuild/\`"
            echo "- Build tree directory: \`build/\`"
            echo "- Package artifacts and generated packaging files are uploaded from this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Arch packaging artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-packaging-files
          path: |
            arch-pkgbuild/PKGBUILD
            arch-pkgbuild/polaris.install
          if-no-files-found: warn

      - name: Upload Arch package outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-package-outputs
          path: |
            arch-pkgbuild/*.pkg.tar.*
            arch-pkgbuild/*.pkg.tar.*.sig
            arch-pkgbuild/*.src.tar.*
            arch-pkgbuild/*.log
            arch-pkgbuild/package-*.txt
          if-no-files-found: warn

      - name: Upload Arch build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-build-metadata
          path: |
            build/dev.polaris-stream.app.Polaris.metainfo.xml
            build/dev.polaris-stream.app.Polaris.desktop
            build/dev.polaris-stream.app.Polaris.terminal.desktop
          if-no-files-found: warn

  arch-current-compatibility:
    name: Arch rolling compatibility
    needs: [resolve-source, cpp-sanitizer-tests, arch-build]
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    container:
      # The container identity is immutable; its mirror is deliberately live.
      # This observation is separate from the reproducible snapshot build and
      # catches rolling-repository ABI drift before an asset is published.
      image: archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a

    steps:
      - name: Synchronize current Arch repositories
        run: |
          set -euo pipefail
          printf 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm

      - name: Download exact Arch package
        uses: actions/download-artifact@v8
        with:
          name: arch-package-outputs
          path: arch-current-package

      - name: Install and launch against current Arch
        run: |
          set -euo pipefail

          pkg_path="$(find arch-current-package -maxdepth 1 -type f -name 'polaris-[0-9]*-x86_64.pkg.tar.*' ! -name '*debug*' | sort | head -n 1)"
          if [ -z "$pkg_path" ]; then
            echo "No Arch package was available for current-repository validation" >&2
            exit 1
          fi

          pacman -U --noconfirm "$pkg_path"
          pacman -Q boost-libs | tee arch-current-package/current-boost.txt
          pacman -Ql polaris | tee arch-current-package/package-installed-files.txt >/dev/null
          installed_binary="$(awk '/\/usr\/bin\/polaris-[0-9][^/]*$/ { print $2; exit }' arch-current-package/package-installed-files.txt)"
          if [ -z "$installed_binary" ]; then
            echo "Installed Polaris binary was not found" >&2
            exit 1
          fi

          ldd "$installed_binary" | tee arch-current-package/package-ldd.txt
          if grep -Fq "not found" arch-current-package/package-ldd.txt; then
            echo "Arch package has unresolved libraries in the current rolling repository" >&2
            exit 1
          fi
          polaris --version | tee arch-current-package/package-version.txt

      - name: Upload current Arch compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-current-compatibility
          path: arch-current-package/*.txt
          if-no-files-found: warn

  fedora-clang-build:
    name: Fedora 44 Clang compile check
    needs: [resolve-source, web-checks, cpp-sanitizer-tests, arch-build]
    if: needs.resolve-source.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_COMPILERCHECK: content
      NPM_CONFIG_CACHE: /github/home/.npm
      CC: clang
      CXX: clang++

    steps:
      - name: Bootstrap Fedora container
        run: |
          for attempt in 1 2 3; do
            dnf install -y dnf-plugins-core git && exit 0
            echo "dnf bootstrap failed on attempt ${attempt}" >&2
            dnf clean expire-cache || true
            sleep $((attempt * 10))
          done
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            git submodule sync --recursive
            # Trees from before the build-deps submodule removal still pin its
            # dead commit; skip it instead of gambling on the orphaned object.
            if git -c protocol.version=2 -c submodule.third-party/build-deps.update=none submodule update --init --force --recursive --jobs 1; then
              exit 0
            fi
            echo "submodule update failed on attempt ${attempt}" >&2
            git submodule deinit --force --all || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Cache C++ compiler outputs
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ccache
          key: polaris-fedora-44-clang-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'src/**/*', 'tests/**/*') }}
          restore-keys: |
            polaris-fedora-44-clang-ccache-

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: /github/home/.npm
          key: polaris-fedora-44-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            polaris-fedora-44-npm-
      - name: Cache Go module downloads
        uses: actions/cache@v6
        with:
          path: /github/home/go/pkg/mod
          key: polaris-fedora-44-clang-gomod-${{ hashFiles('browser_stream_helper/go.sum') }}
          restore-keys: |
            polaris-fedora-44-clang-gomod-

      - name: Install Fedora build dependencies
        run: |
          for attempt in 1 2 3; do
            dnf builddep -y packaging/linux/fedora/Polaris.spec && exit 0
            echo "dnf builddep failed on attempt ${attempt}" >&2
            dnf clean expire-cache || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install CI helper packages
        run: |
          for attempt in 1 2 3; do
            dnf install -y ccache clang golang ninja-build patch python3 && exit 0
            echo "dnf helper package install failed on attempt ${attempt}" >&2
            dnf clean expire-cache || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_C_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            -DBOOST_USE_STATIC=OFF \
            -DPOLARIS_ASSETS_DIR=share/polaris \
            -DPOLARIS_EXECUTABLE_PATH=/usr/bin/polaris \
            -DPOLARIS_ENABLE_BROWSER_STREAM=ON \
            -DPOLARIS_ENABLE_PIPEWIRE=OFF \
            -DPOLARIS_ENABLE_PORTAL=ON \
            -DPOLARIS_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF

      - name: Download prebuilt web UI bundle
        uses: actions/download-artifact@v8
        with:
          name: web-ui-build
          path: .

      - name: Prepare prebuilt web UI bundle
        run: |
          mkdir -p build/assets build/CMakeFiles node_modules
          tar -xzf web-ui-build.tar.gz -C build/assets
          touch node_modules/.polaris-web-ui-npm.stamp build/CMakeFiles/web-ui-build.stamp

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run fast C++ tests
        run: ctest --test-dir build/tests --output-on-failure -R '^test_polaris$'

  steamos-build:
    name: SteamOS 3.8 build
    needs: [resolve-source, web-checks, cpp-sanitizer-tests, arch-build]
    if: needs.resolve-source.outputs.native_required == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Resolve exact SteamOS source commit
        run: |
          git fetch --no-tags --force origin "$POLARIS_CHECKOUT_REF"
          POLARIS_BUILD_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$POLARIS_BUILD_COMMIT"
          printf 'POLARIS_BUILD_COMMIT=%s\n' "$POLARIS_BUILD_COMMIT" >> "$GITHUB_ENV"

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive
          # Trees from before the build-deps submodule removal still pin its
          # dead commit; skip it instead of gambling on the orphaned object.
          git -c submodule.third-party/build-deps.update=none submodule update --init --recursive

      - name: Build and validate SteamOS 3.8 package
        run: |
          mkdir -p "$RUNNER_TEMP/polaris-steamos-output"
          sudo docker run --privileged --rm \
            --env "POLARIS_BUILD_COMMIT=$POLARIS_BUILD_COMMIT" \
            --volume "$GITHUB_WORKSPACE:/workspace:rw" \
            --volume "$RUNNER_TEMP/polaris-steamos-output:/output:rw" \
            archlinux:latest \
            bash /workspace/scripts/ci/run-steamos-build.sh

      - name: Upload SteamOS 3.8 package
        uses: actions/upload-artifact@v7
        with:
          name: Polaris-steamos3.8-package
          path: "${{ runner.temp }}/polaris-steamos-output/Polaris-steamos3.8-x86_64.pkg.tar.zst"
          if-no-files-found: error

      - name: Upload SteamOS 3.8 validation receipts
        uses: actions/upload-artifact@v7
        with:
          name: Polaris-steamos3.8-receipts
          path: ${{ runner.temp }}/polaris-steamos-output/steamos3.8-*.txt
          if-no-files-found: error

  ubuntu-build:
    name: Ubuntu build
    needs: [resolve-source, web-checks, cpp-sanitizer-tests, arch-build]
    if: needs.resolve-source.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ~/.cache/ccache
      CCACHE_COMPILERCHECK: content
      BRANCH: ${{ github.head_ref || inputs.release_tag || github.ref_name }}
      BUILD_VERSION: ${{ needs.resolve-source.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            git submodule sync --recursive
            # Trees from before the build-deps submodule removal still pin its
            # dead commit; skip it instead of gambling on the orphaned object.
            if git -c protocol.version=2 -c submodule.third-party/build-deps.update=none submodule update --init --force --recursive --jobs 1; then
              exit 0
            fi
            echo "submodule update failed on attempt ${attempt}" >&2
            git submodule deinit --force --all || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Ubuntu package downloads
        uses: actions/cache@v6
        with:
          path: /var/tmp/polaris-ubuntu-archives
          key: polaris-ubuntu-apt-${{ env.UBUNTU_APT_SNAPSHOT }}-build-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            polaris-ubuntu-apt-${{ env.UBUNTU_APT_SNAPSHOT }}-build-

      - name: Cache C++ compiler outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: polaris-ubuntu-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'src/**/*', 'tests/**/*') }}
          restore-keys: |
            polaris-ubuntu-ccache-
      - name: Cache Go module downloads
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: polaris-ubuntu-gomod-${{ hashFiles('browser_stream_helper/go.sum') }}
          restore-keys: |
            polaris-ubuntu-gomod-

      - name: Install dependencies
        timeout-minutes: 40
        run: |
          snapshot_sources="$RUNNER_TEMP/polaris-ubuntu-snapshot.sources"
          snapshot_source_parts="$RUNNER_TEMP/polaris-ubuntu-source-parts"
          snapshot_lists="$RUNNER_TEMP/polaris-ubuntu-lists"
          snapshot_archives="/var/tmp/polaris-ubuntu-archives"
          mkdir -p "$snapshot_source_parts" "$snapshot_lists/partial" "$snapshot_archives/partial"
          sudo chown -R _apt:root "$snapshot_archives/partial"
          cat > "$snapshot_sources" <<EOF
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/$UBUNTU_APT_SNAPSHOT/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$snapshot_sources"
            -o "Dir::Etc::sourceparts=$snapshot_source_parts"
            -o "Dir::State::Lists=$snapshot_lists"
            -o "Dir::Cache::archives=$snapshot_archives"
            -o APT::Update::Error-Mode=any
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          curl_snapshot_version="$(apt-cache "${apt_options[@]}" madison libcurl4-openssl-dev | awk 'NR == 1 {print $3}')"
          if [[ -z "$curl_snapshot_version" ]]; then
            echo "::error::Pinned Ubuntu snapshot does not contain libcurl4-openssl-dev"
            exit 1
          fi
          sudo apt-get "${apt_options[@]}" install -y --allow-downgrades \
            build-essential ccache cmake ninja-build \
            libboost-all-dev libssl-dev libevdev-dev \
            libpulse-dev libopus-dev \
            "libcurl4t64=$curl_snapshot_version" "libcurl4-openssl-dev=$curl_snapshot_version" \
            libdrm-dev libgbm-dev libcap-dev libwayland-dev \
            libpipewire-0.3-dev libx11-dev libxrandr-dev \
            libxfixes-dev libxi-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libva-dev libminiupnpc-dev libnotify-dev nlohmann-json3-dev \
            libappindicator3-dev libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            glslang-tools libvulkan-dev \
            golang-go \
            wayland-protocols
          sudo chmod -R a+rX "$snapshot_archives"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_C_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            -DPOLARIS_ASSETS_DIR=share/polaris \
            -DPOLARIS_EXECUTABLE_PATH=/usr/bin/polaris \
            -DPOLARIS_ENABLE_CUDA=OFF \
            -DPOLARIS_ENABLE_BROWSER_STREAM=ON \
            -DCUDA_FAIL_ON_MISSING=OFF

      - name: Download prebuilt web UI bundle
        uses: actions/download-artifact@v8
        with:
          name: web-ui-build
          path: .

      - name: Prepare prebuilt web UI bundle
        run: |
          mkdir -p build/assets build/CMakeFiles node_modules
          tar -xzf web-ui-build.tar.gz -C build/assets
          touch node_modules/.polaris-web-ui-npm.stamp build/CMakeFiles/web-ui-build.stamp

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run fast C++ tests
        run: ctest --test-dir build/tests --output-on-failure -R '^test_polaris$'

      - name: Build DEB package
        run: cpack -G DEB --config ./build/CPackConfig.cmake

      - name: Smoke test Ubuntu DEB package
        timeout-minutes: 5
        run: |
          set -euo pipefail

          deb_path="$(find build/cpack_artifacts -maxdepth 1 -type f -name '*.deb' | sort | head -n 1)"
          if [ -z "$deb_path" ]; then
            echo "No binary DEB was produced" >&2
            exit 1
          fi

          package_name="$(dpkg-deb --field "$deb_path" Package)"
          package_version="$(dpkg-deb --field "$deb_path" Version)"
          package_architecture="$(dpkg-deb --field "$deb_path" Architecture)"
          package_identity="${package_name}|${package_version}|${package_architecture}"
          expected_package_identity="polaris|${BUILD_VERSION}|amd64"
          printf '%s\n' "$package_identity" | tee build/cpack_artifacts/package-identity.txt
          if [ "$package_identity" != "$expected_package_identity" ]; then
            echo "Ubuntu package identity mismatch: expected '$expected_package_identity', got '$package_identity'" >&2
            exit 1
          fi

          dpkg-deb --info "$deb_path" | tee build/cpack_artifacts/package-info.txt
          dpkg-deb --field "$deb_path" Depends | tee build/cpack_artifacts/package-depends.txt
          dpkg-deb --contents "$deb_path" | tee build/cpack_artifacts/package-files.txt

          snapshot_sources="$RUNNER_TEMP/polaris-ubuntu-snapshot.sources"
          snapshot_source_parts="$RUNNER_TEMP/polaris-ubuntu-source-parts"
          snapshot_lists="$RUNNER_TEMP/polaris-ubuntu-lists"
          test -s "$snapshot_sources"
          test -d "$snapshot_source_parts"
          test -d "$snapshot_lists/partial"
          apt_options=(
            -o "Dir::Etc::sourcelist=$snapshot_sources"
            -o "Dir::Etc::sourceparts=$snapshot_source_parts"
            -o "Dir::State::Lists=$snapshot_lists"
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" install -y "./$deb_path"
          package_name="$(dpkg-deb --field "$deb_path" Package)"
          binary="$(dpkg -L "$package_name" | awk '$0 == "/usr/bin/polaris" || /\/usr\/bin\/polaris-[0-9][^/]*$/ { print; exit }')"
          if [ -z "$binary" ]; then
            echo "Installed Polaris binary was not found" >&2
            exit 1
          fi
          if ! dpkg -L "$package_name" | grep -Fxq /usr/bin/polaris-browser-stream-helper; then
            echo "Installed Ubuntu DEB is missing the Browser Stream helper" >&2
            exit 1
          fi
          for gamescope_payload in /usr/bin/polaris-gamescope-session /usr/bin/polaris-gamescope-runtime-lib.sh; do
            if ! dpkg -L "$package_name" | grep -Fxq "$gamescope_payload" || [ ! -x "$gamescope_payload" ]; then
              echo "Installed Ubuntu DEB is missing a Gamescope payload: $gamescope_payload" >&2
              exit 1
            fi
            bash -n "$gamescope_payload"
          done

          readelf -d "$binary" | tee build/cpack_artifacts/package-needed.txt
          ldd "$binary" | tee build/cpack_artifacts/package-ldd.txt
          if grep -Fq "not found" build/cpack_artifacts/package-ldd.txt; then
            echo "Installed Ubuntu DEB has unresolved shared-library dependencies" >&2
            exit 1
          fi
          bash scripts/check-packaged-binary-paths.sh \
            "$binary" \
            build/cpack_artifacts/package-strings.txt

          polaris --version | tee build/cpack_artifacts/package-version.txt

      - name: Summarize Ubuntu DEB validation
        if: always()
        run: |
          {
            echo "## Ubuntu 24.04 DEB validation"
            echo
            echo "- Build tree directory: \`build/\`"
            echo "- DEB output directory: \`build/cpack_artifacts/\`"
            echo "- DEB artifacts and generated CPack metadata are uploaded from this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ubuntu DEB artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-24.04-deb-artifacts
          path: |
            build/cpack_artifacts/*.deb
          if-no-files-found: warn

      - name: Upload Ubuntu DEB metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-24.04-deb-metadata
          path: |
            build/cpack_artifacts/package-*.txt
            build/cpack_artifacts/_CPack_Packages/Linux/DEB/**/*.out
            build/cpack_artifacts/_CPack_Packages/Linux/DEB/**/*.err
          if-no-files-found: warn

