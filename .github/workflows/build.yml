          for attempt in 1 2 3; do
            dnf install -y ccache golang ninja-build patch python3 && exit 0
            echo "dnf helper package install failed on attempt ${attempt}" >&2
            dnf clean expire-cache || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install CUDA toolkit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          cuda_supported_architectures=("x86_64" "aarch64")
          if [[ " ${cuda_supported_architectures[*]} " != *" ${architecture} "* ]]; then
            echo "CUDA toolkit install skipped for unsupported architecture ${architecture}"
            exit 0
          fi

          cuda_version="13.2.1"
          cuda_build="595.58.03"
          cuda_dir="${GITHUB_WORKSPACE}/.cuda"
          cuda_suffix=""
          if [ "${architecture}" = "aarch64" ]; then
            cuda_suffix="_sbsa"
          fi

          if [ ! -x "${cuda_dir}/bin/nvcc" ]; then
            mkdir -p "${cuda_dir}" "${GITHUB_WORKSPACE}/.cuda-tmp"
            cuda_url="https://developer.download.nvidia.com/compute/cuda/${cuda_version}/local_installers/cuda_${cuda_version}_${cuda_build}_linux${cuda_suffix}.run"
            wget \
              "${cuda_url}" \
              --progress=bar:force:noscroll \
              --retry-connrefused \
              --tries=3 \
              -q -O "${GITHUB_WORKSPACE}/cuda.run"
            chmod a+x "${GITHUB_WORKSPACE}/cuda.run"
            "${GITHUB_WORKSPACE}/cuda.run" \
              --no-drm \
              --no-man-page \
              --no-opengl-libs \
              --override \
              --silent \
              --tmpdir="${GITHUB_WORKSPACE}/.cuda-tmp" \
              --toolkit \
              --toolkitpath="${cuda_dir}"
            rm "${GITHUB_WORKSPACE}/cuda.run"
          fi

          if [ "${{ matrix.fedora }}" = "42" ]; then
            math_header="$(find "${cuda_dir}" -path '*/include/crt/math_functions.h' -print -quit)"
            if [ -z "${math_header}" ]; then
              echo "CUDA math_functions.h was not found" >&2
              exit 1
            fi
            if grep -Fq "__NV_IEC_60559_FUNCS_EXCEPTION_SPECIFIER" "${math_header}"; then
              echo "${math_header} already has NVIDIA IEC 60559 exception specifiers"
            else
              sed -E -i \
                -e 's/(sinpi\([^)]*\))( noexcept( ?\(true\))?)?;/\1 noexcept(true);/' \
                -e 's/(sinpif\([^)]*\))( noexcept( ?\(true\))?)?;/\1 noexcept(true);/' \
                -e 's/(cospi\([^)]*\))( noexcept( ?\(true\))?)?;/\1 noexcept(true);/' \
                -e 's/(cospif\([^)]*\))( noexcept( ?\(true\))?)?;/\1 noexcept(true);/' \
                "${math_header}"
              for declaration in \
                'sinpi\([^)]*\) noexcept ?\(true\);' \
                'sinpif\([^)]*\) noexcept ?\(true\);' \
                'cospi\([^)]*\) noexcept ?\(true\);' \
                'cospif\([^)]*\) noexcept ?\(true\);'
              do
                if ! grep -Eq "${declaration}" "${math_header}"; then
                  echo "CUDA math_functions.h is missing ${declaration}" >&2
                  exit 1
                fi
              done
            fi
          fi

      - name: Configure
        env:
          POLARIS_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          cmake_args=(
            -B build
            -G Ninja
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_C_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=${GITHUB_WORKSPACE}=." \
            -DBOOST_USE_STATIC=${{ matrix.boost_static }} \
            -DPOLARIS_ASSETS_DIR=share/polaris \
            -DPOLARIS_EXECUTABLE_PATH=/usr/bin/polaris \
            -DPOLARIS_ENABLE_BROWSER_STREAM=ON
            -DPOLARIS_ENABLE_PIPEWIRE=OFF
            -DPOLARIS_ENABLE_PORTAL=ON
          )

          if [ "${POLARIS_RELEASE_BUILD}" = "true" ]; then
            cmake_args+=(
              -DPOLARIS_ENABLE_CUDA=ON
              -DCUDA_FAIL_ON_MISSING=ON
              -DCMAKE_CUDA_COMPILER:PATH="${GITHUB_WORKSPACE}/.cuda/bin/nvcc"
              -DCMAKE_CUDA_HOST_COMPILER="${CXX}"
            )
          else
            cmake_args+=(
              -DPOLARIS_ENABLE_CUDA=OFF
              -DCUDA_FAIL_ON_MISSING=OFF
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Download prebuilt web UI bundle
        uses: actions/download-artifact@v8
        with:
          name: web-ui-build
          path: .

      - name: Prepare prebuilt web UI bundle
        run: |
          mkdir -p build/assets build/CMakeFiles node_modules
          tar -xzf web-ui-build.tar.gz -C build/assets
          touch node_modules/.polaris-web-ui-npm.stamp build/CMakeFiles/web-ui-build.stamp

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run fast C++ tests
        run: ctest --test-dir build/tests --output-on-failure -R '^test_polaris$'

      - name: Build RPM package
        run: cpack -G RPM --config ./build/CPackConfig.cmake

      - name: Smoke test Fedora RPM package
        run: |
          set -euo pipefail

          rpm_path="$(find build/cpack_artifacts -maxdepth 1 -type f -name '*.rpm' ! -name '*.src.rpm' | sort | head -n 1)"
          if [ -z "$rpm_path" ]; then
            echo "No binary RPM was produced" >&2
            exit 1
          fi

          package_identity="$(rpm -qp --qf '%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}\n' "$rpm_path")"
          expected_package_identity="polaris|${BUILD_VERSION}|1|x86_64"
          printf '%s\n' "$package_identity" | tee build/cpack_artifacts/package-identity.txt
          if [ "$package_identity" != "$expected_package_identity" ]; then
            echo "Fedora package identity mismatch: expected '$expected_package_identity', got '$package_identity'" >&2
            exit 1
          fi

          rpm -Kv "$rpm_path"
          rpm -qpi "$rpm_path" | tee build/cpack_artifacts/package-info.txt
          rpm -qpR "$rpm_path" | sort | tee build/cpack_artifacts/package-requires.txt

          expected_miniupnpc="$(rpm -q --provides miniupnpc | awk '/libminiupnpc\.so\.[0-9]+\(\)\(64bit\)/ { print $1; exit }')"
          actual_miniupnpc="$(awk '/libminiupnpc\.so\.[0-9]+\(\)\(64bit\)/ { print $1; exit }' build/cpack_artifacts/package-requires.txt)"
          if [ -z "$expected_miniupnpc" ] || [ "$actual_miniupnpc" != "$expected_miniupnpc" ]; then
            echo "RPM miniupnpc soname mismatch: expected '${expected_miniupnpc}', got '${actual_miniupnpc}'" >&2
            exit 1
          fi

          dnf install -y "$rpm_path"
          rpm -ql polaris | tee build/cpack_artifacts/package-files.txt
          binary="$(awk '$0 == "/usr/bin/polaris" || /\/usr\/bin\/polaris-[0-9][^/]*$/ { print; exit }' build/cpack_artifacts/package-files.txt)"
          if [ -z "$binary" ]; then
            echo "Installed Polaris binary was not found" >&2
            exit 1
          fi
          if ! grep -Fxq /usr/bin/polaris-browser-stream-helper build/cpack_artifacts/package-files.txt; then
            echo "Installed Fedora RPM is missing the Browser Stream helper" >&2
            exit 1
          fi
          for gamescope_payload in /usr/bin/polaris-gamescope-session /usr/bin/polaris-gamescope-runtime-lib.sh; do
            if ! grep -Fxq "$gamescope_payload" build/cpack_artifacts/package-files.txt || [ ! -x "$gamescope_payload" ]; then
              echo "Installed Fedora RPM is missing a Gamescope payload: $gamescope_payload" >&2
              exit 1
            fi
            bash -n "$gamescope_payload"
          done

          readelf -d "$binary" | tee build/cpack_artifacts/package-needed.txt
          ldd "$binary" | tee build/cpack_artifacts/package-ldd.txt
          if grep -Fq "not found" build/cpack_artifacts/package-ldd.txt; then
            echo "Installed Fedora RPM has unresolved shared-library dependencies" >&2
            exit 1
          fi
          bash scripts/check-packaged-binary-paths.sh \
            "$binary" \
            build/cpack_artifacts/package-strings.txt \
            --forbid-native-pipewire-audio

          polaris --version | tee build/cpack_artifacts/package-version.txt
          if [ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}" = "true" ] &&
              ! grep -Fq "cuda=enabled" build/cpack_artifacts/package-version.txt; then
            echo "Release Fedora RPM was not built with CUDA enabled" >&2
            exit 1
          fi

      - name: Summarize Fedora RPM validation
        if: always()
        run: |
          {
            echo "## Fedora ${{ matrix.fedora }} RPM validation"
            echo
            echo "- Spec dependency source: \`packaging/linux/fedora/Polaris.spec\`"
            echo "- Build tree directory: \`build/\`"
            echo "- RPM output directory: \`build/cpack_artifacts/\`"
            echo "- RPM artifacts and generated CPack RPM metadata are uploaded from this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fedora RPM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ matrix.fedora }}-rpm-artifacts
          path: |
            build/cpack_artifacts/*.rpm
            build/cpack_artifacts/*.src.rpm
          if-no-files-found: warn

      - name: Upload Fedora RPM metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ matrix.fedora }}-rpm-metadata
          path: |
            build/cpack_artifacts/package-*.txt
            build/cpack_artifacts/_CPack_Packages/Linux/RPM/SPECS/*.spec
            build/cpack_artifacts/_CPack_Packages/Linux/RPM/*.out
            build/cpack_artifacts/_CPack_Packages/Linux/RPM/*.err
          if-no-files-found: warn

  sysext-build:
    name: Systemd extension image
    needs:
      - resolve-source
      - fedora-rpm-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools rpm2cpio cpio systemd-container
      - name: Download Fedora 44 RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-44-rpm-artifacts
          path: sysext/raw
      - name: Build the extension image from the Fedora 44 RPM
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The artifact carries CPack's unversioned Polaris.rpm symlink beside the
          # real package; only a regular, versioned binary RPM is a valid input.
          mapfile -t binary_rpms < <(
            find sysext/raw -type f -name 'Polaris-*.rpm' ! -name '*.src.rpm' | sort
          )
          if [ "${#binary_rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one Fedora 44 binary RPM, found ${#binary_rpms[@]}: ${binary_rpms[*]}" >&2
            find sysext/raw -maxdepth 3 -printf '%y %p\n' >&2
            exit 1
          fi
          bash scripts/ci/build-sysext-image.sh "${binary_rpms[0]}" sysext/out/Polaris-sysext-x86_64.raw
      - name: Validate the image as a system extension
        run: |
          set -euo pipefail
          # The extension declares the name polaris, so systemd only accepts the
          # image as a sysext under that file name; the release asset keeps the
          # Polaris-* name and the guide installs it as polaris.raw.
          cp sysext/out/Polaris-sysext-x86_64.raw sysext/out/polaris.raw
          sudo systemd-dissect sysext/out/polaris.raw | tee sysext/out/dissect.txt
          grep -q 'sysext for system' sysext/out/dissect.txt
          grep -q 'ID=_any' sysext/out/dissect.txt
          rm -f sysext/out/polaris.raw
      - name: Upload the extension image
        uses: actions/upload-artifact@v7
        with:
          name: Polaris-sysext-image
          path: sysext/out/Polaris-sysext-x86_64.raw
          if-no-files-found: error

  release-assets:
    name: Release assets
    needs:
      - resolve-source
      - arch-build
      - arch-current-compatibility
      - steamos-build
      - ubuntu-build
      - fedora-rpm-build
      - sysext-build
      - cpp-sanitizer-tests
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Download Arch package outputs
        uses: actions/download-artifact@v8
        with:
          name: arch-package-outputs
          path: release-assets/raw/arch

      - name: Download Fedora 44 RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-44-rpm-artifacts
          path: release-assets/raw/fedora44

      - name: Download Ubuntu 24.04 DEB artifacts
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-24.04-deb-artifacts
          path: release-assets/raw/ubuntu24.04

      - name: Download SteamOS 3.8 package
        uses: actions/download-artifact@v8
        with:
          name: Polaris-steamos3.8-package
          path: release-assets/raw/steamos3.8
      - name: Download systemd extension image
        uses: actions/download-artifact@v8
        with:
          name: Polaris-sysext-image
          path: release-assets/raw/sysext

      - name: Prepare release asset names
        run: |
          mkdir -p release-assets/staged release-assets/final
          shopt -s nullglob
          steamos_packages=(release-assets/raw/steamos3.8/*.pkg.tar.zst)
          if [ "${#steamos_packages[@]}" -ne 1 ]; then
            exit 1
          fi
          cp "release-assets/raw/steamos3.8/Polaris-steamos3.8-x86_64.pkg.tar.zst" "release-assets/staged/Polaris-steamos3.8-x86_64.pkg.tar.zst"
          cp "release-assets/raw/steamos3.8/Polaris-steamos3.8-x86_64.pkg.tar.zst" "release-assets/final/Polaris-steamos3.8-x86_64.pkg.tar.zst"

          arch_packages=()
          arch_sources=()
          arch_signatures=()
          for arch_path in release-assets/raw/arch/*; do
            case "$arch_path" in
              *.pkg.tar.*.sig)
                arch_signatures+=("$arch_path")
                ;;
              *debug*.pkg.tar.*)
                ;;
              *.pkg.tar.*)
                arch_packages+=("$arch_path")
                ;;
              *.src.tar.*)
                arch_sources+=("$arch_path")
                ;;
            esac
          done

          if [ "${#arch_packages[@]}" -eq 0 ]; then
            echo "No Arch package outputs were produced by the Arch packaging job" >&2
            exit 1
          fi

          arch_package_name="$(basename "${arch_packages[0]}")"
          arch_package_suffix="${arch_package_name#*.pkg.tar}"
          cp "${arch_packages[0]}" "release-assets/final/Polaris-arch-x86_64.pkg.tar${arch_package_suffix}"

          if [ "${#arch_signatures[@]}" -gt 0 ]; then
            cp "${arch_signatures[0]}" "release-assets/final/Polaris-arch-x86_64.pkg.tar${arch_package_suffix}.sig"
          fi

          if [ "${#arch_sources[@]}" -gt 0 ]; then
            arch_source_name="$(basename "${arch_sources[0]}")"
            arch_source_suffix="${arch_source_name#*.src.tar}"
            cp "${arch_sources[0]}" "release-assets/final/Polaris-arch-src.tar${arch_source_suffix}"
          fi

          copy_fedora_rpms() {
            local fedora_version="$1"
            local raw_dir="$2"
            local binary_rpms=()
            local source_rpms=()
            local rpm_path

            for rpm_path in "${raw_dir}"/*.rpm; do
              if [[ "$rpm_path" == *.src.rpm ]]; then
                source_rpms+=("$rpm_path")
              else
                binary_rpms+=("$rpm_path")
              fi
            done

            if [ "${#binary_rpms[@]}" -eq 0 ]; then
              echo "No binary RPMs were produced for Fedora ${fedora_version}" >&2
              exit 1
            fi

            cp "${binary_rpms[0]}" "release-assets/final/Polaris-fedora${fedora_version}-x86_64.rpm"

            if [ "${#source_rpms[@]}" -gt 0 ]; then
              cp "${source_rpms[0]}" "release-assets/final/Polaris-fedora${fedora_version}-src.rpm"
            fi
          }

          copy_fedora_rpms 44 release-assets/raw/fedora44

          ubuntu_debs=()
          for deb_path in release-assets/raw/ubuntu24.04/*.deb; do
            ubuntu_debs+=("$deb_path")
          done

          if [ "${#ubuntu_debs[@]}" -eq 0 ]; then
            echo "No binary DEBs were produced for Ubuntu 24.04" >&2
            exit 1
          fi

          cp "${ubuntu_debs[0]}" "release-assets/final/Polaris-ubuntu24.04-x86_64.deb"
          sysext_images=(release-assets/raw/sysext/*.raw)
          if [ "${#sysext_images[@]}" -ne 1 ]; then
            echo "Expected exactly one systemd extension image, found ${#sysext_images[@]}" >&2
            exit 1
          fi
          cp "${sysext_images[0]}" "release-assets/final/Polaris-sysext-x86_64.raw"

          ls -la release-assets/staged release-assets/final

      - name: Revalidate release tag against packaged source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail

          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release checkout $checked_out_commit does not match packaged source $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi

          git tag -d "${POLARIS_PACKAGE_REF_NAME}" >/dev/null 2>&1 || true
          git fetch --no-tags --force origin \
            "refs/tags/${POLARIS_PACKAGE_REF_NAME}:refs/tags/${POLARIS_PACKAGE_REF_NAME}"
          tag_commit="$(git rev-parse "refs/tags/${POLARIS_PACKAGE_REF_NAME}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release tag ${POLARIS_PACKAGE_REF_NAME} moved to $tag_commit; expected $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Stage curated GitHub release
        id: stage-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_notes="docs/release-notes/${POLARIS_PACKAGE_REF_NAME}.md"
          if [ ! -s "$release_notes" ]; then
            echo "Missing curated release notes: $release_notes" >&2
            exit 1
          fi

          if ! gh release view "${POLARIS_PACKAGE_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${POLARIS_PACKAGE_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "${POLARIS_PACKAGE_REF_NAME}" \
              --notes-file "$release_notes"
            echo "publish_draft=true" >> "$GITHUB_OUTPUT"
          else
            gh release edit "${POLARIS_PACKAGE_REF_NAME}" \
              --verify-tag \
              --draft=true \
              --title "${POLARIS_PACKAGE_REF_NAME}" \
              --notes-file "$release_notes"
            echo "publish_draft=true" >> "$GITHUB_OUTPUT"
          fi

          expected_notes="$(cat "$release_notes")"
          published_notes="$(gh release view "${POLARIS_PACKAGE_REF_NAME}" --json body --jq .body)"
          if [ "$published_notes" != "$expected_notes" ]; then
            echo "Published release notes do not match $release_notes" >&2
            exit 1
          fi

      - name: Upload release assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_files=(release-assets/final/*)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No finalized release assets are available" >&2
            exit 1
          fi

          declare -A expected_asset_names=()
          for release_file in "${release_files[@]}"; do
            expected_asset_names["$(basename "$release_file")"]=1
          done

          mapfile -t published_assets < <(
            gh release view "${POLARIS_PACKAGE_REF_NAME}" --json assets --jq '.assets[].name'
          )
          for published_asset in "${published_assets[@]}"; do
            if [[ -z "${expected_asset_names[$published_asset]+present}" ]]; then
              gh release delete-asset "${POLARIS_PACKAGE_REF_NAME}" "$published_asset" --yes
            fi
          done

          gh release upload "${POLARIS_PACKAGE_REF_NAME}" "${release_files[@]}" --clobber

      - name: Verify release assets on GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t expected_assets < <(
            find release-assets/final -maxdepth 1 -type f -printf '%f\n' | sort
          )
          required_binary_assets=(
            Polaris-arch-x86_64.pkg.tar.zst
            Polaris-fedora44-x86_64.rpm
            Polaris-steamos3.8-x86_64.pkg.tar.zst
            Polaris-ubuntu24.04-x86_64.deb
          )
          for required_asset in "${required_binary_assets[@]}"; do
            if [[ ! " ${expected_assets[*]} " =~ " ${required_asset} " ]]; then
              echo "Finalized release assets are missing required binary: $required_asset" >&2
              exit 1
            fi
          done
          mapfile -t published_assets < <(
            gh release view "${POLARIS_PACKAGE_REF_NAME}" --json assets --jq '.assets[].name' | sort
          )
          if [ "${#expected_assets[@]}" -eq 0 ] || [ "${expected_assets[*]}" != "${published_assets[*]}" ]; then
            echo "Published assets do not match the exact finalized asset set on ${POLARIS_PACKAGE_REF_NAME}" >&2
            printf 'expected: %s\n' "${expected_assets[*]}" >&2
            printf 'published: %s\n' "${published_assets[*]}" >&2
            exit 1
          fi

      - name: Publish verified draft release
        if: steps.stage-release.outputs.publish_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${POLARIS_PACKAGE_REF_NAME}" --verify-tag --draft=false
