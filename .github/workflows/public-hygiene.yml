name: Public Hygiene

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  public-hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check public repo surface
        run: bash scripts/check-public-surface.sh

      - name: Check public docs and release references
        run: bash scripts/check-public-docs.sh

      - name: Check release package dependency contracts
        run: python3 scripts/check-release-package-dependencies.py

      # The offline half only: hunk headers and patch declarations, no network
      # and no nix. It costs a second, so it runs on everything rather than only
      # on the pull requests that happen to touch nix/.
      - name: Check vendored nix patch stacks
        run: python3 scripts/check-nix-patches.py
